<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/39c5fdd9a0.js" crossorigin="anonymous"></script>
    <style>
        .icon{
            color:red;
            background-color:black;
            padding:10px 15px;
            border-radius: 7px;
            margin-left:10px;
        }
        div{
            display: flex;
            justify-content:space-evenly;
        }
        h1{
            text-transform: uppercase;
            color:#00ff00;
            font-size:20px;
        }
        body{
            background-color:rgb(161, 247, 247);
        }
    </style>
</head>
<body>
    <div>
        <h1>home <i class="fa-solid fa-house icon"></i></h1>
    <h1>cart <i class="fa-solid fa-cart-shopping icon"></i></h1>
    <h1>cancel <i class="fa-regular fa-circle-xmark icon"></i></h1>
    <h1>car <i class="fa-solid fa-car icon"></i></h1>
    <h1>sun <i class="fa-solid fa-sun icon"></i></h1>
    </div>
</body>
</html>
