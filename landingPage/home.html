<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedMart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">

<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/light/style.css">
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/bold/style.css">
  <style>
        .font-manrope {
            font-family: 'Manrope', sans-serif;
        }

        .font-inter {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>
   <section id="hero" class=" bg-gradient-to-br
                from-[#E9F3FE]
                via-[#DBEBFB]
                to-[#B1D0FB] py-10 ">
     <nav class="flex justify-between mx-10 items-center bg-white px-4 py-2 rounded-2xl  ">
        <img src="./image/logo.png" alt="logo" class="h-[100px] w-[140px]">
        <div class="flex gap-10 ">
            <h1 class="font-inter text-[20px] md:text-[23px] font-thin bg-gradient-to-br from-[#2775E4] to-[#08AEBC] bg-clip-text text-transparent hover:text-[#2775E4]"><a href="#">Features</a></h1>
            <h1 class="font-inter text-[20px] md:text-[23px] font-thin bg-gradient-to-br from-[#2775E4] to-[#08AEBC] bg-clip-text text-transparent hover:text-[#2775E4]"><a href="#">How It Works</a></h1>
            <h1 class="font-inter text-[20px] md:text-[23px] font-thin bg-gradient-to-br from-[#2775E4] to-[#08AEBC] bg-clip-text text-transparent hover:text-[#2775E4]"><a href="#">For Customers</a></h1>
            <h1 class="font-inter text-[20px] md:text-[23px] font-thin bg-gradient-to-br from-[#2775E4] to-[#08AEBC] bg-clip-text text-transparent hover:text-[#2775E4]"><a href="#">Pricing</a></h1>
            <h1 class="font-inter text-[20px] md:text-[23px] font-thin bg-gradient-to-br from-[#2775E4] to-[#08AEBC] bg-clip-text text-transparent hover:text-[#2775E4]"><a href="#">FAQs</a></h1>        </div>
        <div class=" flex gap-5 items-center">
            <button class="py-2 px-4 rounded-2xl hover:scale-[1.01] cursor-pointer shadow-md text-[20px] hover:bg-[white] hover:text-[#2775E4] hover:border-1 hover:border-[#2775E4] rounded-xl font-inter bg-[#2775E4]  text-white capitalize text-center tracking-wider">login</button>
            <button class="py-2 px-4 rounded-2xl hover:scale-[1.01] cursor-pointer shadow-md text-[20px] hover:bg-[white] hover:text-[#2775E4] hover:border-1 hover:border-[#2775E4] rounded-xl font-inter bg-[#2775E4]  text-white capitalize text-center tracking-wider">signup</button>
        </div>
    </nav>
   <div class="flex flex-col md:flex-row justify-between items-center m-10">
  <!-- Text column -->
  <div class="w-full md:w-1/2 flex-shrink-0">
    <h1 class="text-[#171E26] font-manrope text-4xl md:text-6xl font-extrabold">
      Bring Your Pharmacy Online.
    </h1>
    <p class="text-[#171E26] font-inter font-normal text-lg md:text-xl mt-4">
      Give your customers the convenience of ordering from home while you manage products, prices, orders and fulfillment from one simple platform.
    </p>
    <button class="px-7 py-3.5 rounded-full bg-gradient-to-r from-[#2775E4] to-[#08AEBC] text-white font-semibold shadow-lg shadow-[#2775E4]/20 hover:scale-[1.02] transition capitalize tracking-wider text-[20px] my-3">
      Get Started
    </button>
    <p class="font-inter text-xl capitalize">
      Already have an account?
      <a href="#" class="bg-gradient-to-br from-[#2775E4] to-[#08AEBC] bg-clip-text text-transparent hover:text-[#2775E4]">login</a>
    </p>
  </div>

  <!-- Image column -->
  <div class="w-full md:w-1/2 flex-shrink-0 flex justify-center md:justify-end">
    <img src="./image/hero img.png" class="w-full max-w-[500px] h-auto rounded-2xl shadow-lg" alt="Hero">
  </div>
</div>
   </section>
</body>
</html>
